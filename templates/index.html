<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Analyzer</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <div class="hero">

            <h1>🤖 AI Resume Analyzer</h1>

            <p class="subtitle">
                Upload your resume and get instant AI-powered career insights
            </p>

        </div>

        <form id="resume-form" enctype="multipart/form-data">

            <div class="input-section">

                <label for="resume">
                    📄 Upload Resume (PDF)
                </label>

                <input
                    type="file"
                    id="resume"
                    accept=".pdf"
                >

                <p id="file-name"></p>

            </div>

            <div class="input-section">

                <label for="job-description">
                    💼 Job Description
                </label>

                <textarea
                    id="job-description"
                    placeholder="Paste the job description here..."
                ></textarea>

            </div>

            <button type="submit" id="analyze-btn">
                🚀 Analyze Resume
            </button>

        </form>

        <div id="result"></div>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
